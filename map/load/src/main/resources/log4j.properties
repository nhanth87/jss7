# log4j 1.2 config for jSS7 dependencies that still use org.apache.log4j
# (sctp-impl NettyAssociationImpl, some m3ua/sccp classes).
#
# WHY THIS FILE MATTERS FOR PERFORMANCE:
# Without a log4j 1.2 config on the classpath, log4j 1.2 stays uninitialized and its root
# logger defaults to DEBUG. That makes Logger.isDebugEnabled() return true on the hot SCTP
# send path (NettyAssociationImpl.send), which then does
#     String.format("... %s", payloadData)  ->  PayloadData.toString()  ->  HexTools.dump(...)
# i.e. it hex-dumps the ENTIRE payload of every outgoing message to build a debug string that
# is immediately discarded (there is no appender). Under load this was the single largest CPU
# consumer (JFR: PayloadData.toString/HexTools.dump + StringBuilder churn). Setting the root
# level to WARN makes isDebugEnabled() false, so the whole hex-dump/format path is skipped.
#
# WARN keeps genuinely useful warnings/errors from these deps (congestion, association drops)
# and routes them to a file so they don't corrupt the ANSI TUI on stderr.
log4j.rootLogger=WARN, FILE

log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=log4j1.log
log4j.appender.FILE.MaxFileSize=10MB
log4j.appender.FILE.MaxBackupIndex=2
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{HH:mm:ss.SSS} [%t] %-5p %c{1} - %m%n
